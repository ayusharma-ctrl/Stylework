name: stylework
x-server: &server
  build: ./server
  image: stylework-server:local
  init: true
  env_file:
    - path: ./server/.env
      required: true
  environment:
    PORT: "3000"
  stop_grace_period: 35s

services:
  migrate:
    <<: *server
    command: ["node", "dist/database/cli.js", "migrate"]
  api:
    <<: *server
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ./app
      args:
        VITE_API_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 3s
      retries: 5
