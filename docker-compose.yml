name: stylework
x-server: &server
  build: ./server
  image: stylework-server:local
  init: true
  env_file:
    - path: ./server/.env
      required: false
  environment: &environment
    NODE_ENV: development
    DATABASE_URL: postgres://stylework:stylework@postgres:5432/stylework
    DATABASE_DIRECT_URL: postgres://stylework:stylework@postgres:5432/stylework
    REDIS_URL: redis://redis:6379
    CLIENT_ORIGINS: http://localhost:5173
    RUN_WORKER: "true"
    DB_POOL_MAX: "4"
    WORKER_CONCURRENCY: "1"
  stop_grace_period: 35s

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: stylework
      POSTGRES_PASSWORD: stylework
      POSTGRES_DB: stylework
    ports: ["127.0.0.1:5438:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylework -d stylework"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6388:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *server
    command: ["node", "dist/database/cli.js", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *server
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ./app
      args:
        VITE_API_URL: http://localhost:3000
    ports: ["5173:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  postgres-data:
  redis-data:
