name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stylework
          POSTGRES_PASSWORD: stylework
          POSTGRES_DB: postgres
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U stylework" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
  browser-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T api node dist/database/cli.js seed
      - run: docker compose exec -T api node scripts/smoke.mjs
      - run: npm run test:e2e
        working-directory: app
        env:
          APP_URL: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: app/test-results
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
