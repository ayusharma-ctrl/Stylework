services:
  - type: keyvalue
    name: stylework-queue
    region: singapore
    plan: 1g
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []
  - type: web
    name: stylework-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    dockerCommand: node dist/main.js
    preDeployCommand: node dist/database/cli.js migrate
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - fromGroup: stylework-runtime
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stylework-queue
          property: connectionString
  - type: worker
    name: stylework-worker
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    dockerCommand: node dist/worker.js
    autoDeployTrigger: off
    envVars:
      - fromGroup: stylework-runtime
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stylework-queue
          property: connectionString
envVarGroups:
  - name: stylework-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_POOL_MAX
        value: 10
      - key: WORKER_CONCURRENCY
        value: 10
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
